<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=1280, height=720, initial-scale=1.0" name="viewport"/>
<title>비용 구조 - 0원 강조</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
        }
        /* Flexbox Utilities */
        .flex-col-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .flex-row-center {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
<div class="slide-container">
<!-- Background Elements -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 0px; top: 0px; width: 640px; height: 720px; background-color: #F8F7FF; z-index: 0;"></div>
<div data-object="true" data-object-type="shape" style="position: absolute; left: 640px; top: 0px; width: 640px; height: 720px; background-color: #FFFFFF; z-index: 0;"></div>
<!-- Decorative Circle Top Right -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 1100px; top: -100px; width: 300px; height: 300px; border-radius: 50%; background-color: rgba(97, 0, 255, 0.03); z-index: 0;"></div>
<!-- Header -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 60px; top: 50px; width: 600px; height: 80px; z-index: 10;">
<h1 style="margin: 0; font-size: 36px; font-weight: 800; color: #111827; letter-spacing: -0.02em;">비용 구조</h1>
<p style="margin: 10px 0 0 0; font-size: 18px; font-weight: 500; color: #6b7280;">성과가 발생할 때만 수수료를 지불합니다</p>
</div>
<!-- Left Section: 0 Won Emphasis -->
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 60px; top: 180px; width: 500px; height: 200px; z-index: 10;">
<p style="margin: 0; font-size: 180px; font-weight: 900; color: #6100FF; line-height: 1; letter-spacing: -0.05em;">0<span style="font-size: 80px; font-weight: 700; margin-left: 10px;">원</span></p>
</div>
<div data-object="true" data-object-type="shape" style="position: absolute; left: 60px; top: 380px; width: 500px; height: 4px; background-color: #6100FF; z-index: 5;"></div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 60px; top: 410px; width: 500px; height: 75px; z-index: 10;">
<p style="margin: 0; font-size: 24px; font-weight: 700; color: #374151; line-height: 1.4;">초기 비용도, 유지 비용도<br/>전혀 없습니다.</p>
</div>
<!-- Checklist Container -->
<div data-object="true" data-object-type="shape" style="position: absolute; left: 60px; top: 510px; width: 520px; height: 160px; background-color: white; border-radius: 16px;  z-index: 2;"></div>
<!-- Checklist Item 1 -->
<div data-object="true" data-object-type="icon" style="position: absolute; left: 90px; top: 540px; width: 24px; height: 24px; color: #10B981; font-size: 20px; z-index: 10;">
<i class="fa-solid fa-check"></i>
</div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 125px; top: 538px; width: 150px; height: 30px; z-index: 10;">
<p style="margin: 0; font-size: 16px; font-weight: 500; color: #4B5563;">입점비 0원</p>
</div>
<!-- Checklist Item 2 -->
<div data-object="true" data-object-type="icon" style="position: absolute; left: 90px; top: 585px; width: 24px; height: 24px; color: #10B981; font-size: 20px; z-index: 10;">
<i class="fa-solid fa-check"></i>
</div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 125px; top: 583px; width: 150px; height: 30px; z-index: 10;">
<p style="margin: 0; font-size: 16px; font-weight: 500; color: #4B5563;">월 가입비 0원</p>
</div>
<!-- Checklist Item 3 -->
<div data-object="true" data-object-type="icon" style="position: absolute; left: 90px; top: 630px; width: 24px; height: 24px; color: #10B981; font-size: 20px; z-index: 10;">
<i class="fa-solid fa-check"></i>
</div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 125px; top: 628px; width: 150px; height: 30px; z-index: 10;">
<p style="margin: 0; font-size: 16px; font-weight: 500; color: #4B5563;">연회비 0원</p>
</div>
<!-- Checklist Item 4 -->
<div data-object="true" data-object-type="icon" style="position: absolute; left: 300px; top: 540px; width: 24px; height: 24px; color: #10B981; font-size: 20px; z-index: 10;">
<i class="fa-solid fa-check"></i>
</div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 335px; top: 538px; width: 220px; height: 30px; z-index: 10;">
<p style="margin: 0; font-size: 16px; font-weight: 500; color: #4B5563;">마케팅 비용 0원</p>
</div>
<!-- Checklist Item 5 -->
<div data-object="true" data-object-type="icon" style="position: absolute; left: 300px; top: 585px; width: 24px; height: 24px; color: #10B981; font-size: 20px; z-index: 10;">
<i class="fa-solid fa-check"></i>
</div>
<div data-object="true" data-object-type="textbox" style="position: absolute; left: 335px; top: 583px; width: 220px; height: 30px; z-index: 10;">
<p style="margin: 0; font-size: 16px; font-weight: 500; color: #4B5563;">번역 비용 0원</p>
</div>
<!-- Right Section: Only Fee Card -->
<div class="flex-col-center" data-object="true" data-object-type="shape" style="position: absolute; left: 700px; top: 180px; width: 500px; height: 490px; background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%); border-radius: 24px; z-index: 2; padding-top: 0; justify-content: space-between; overflow: hidden;">
<!-- Accent Header on Card -->
<div style="width: 100%; height: 12px; background-color: #6100FF; flex-shrink: 0;"></div>
<!-- Main Content Area -->
<div class="flex-col-center" style="flex-grow: 1; width: 100%; gap: 10px; padding-top: 10px;">
<div style="text-align: center;">
<p style="margin: 0; font-size: 20px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em;">유일한 비용</p>
<p style="margin: 10px 0 0 0; font-size: 32px; font-weight: 800; color: #111827;">플랫폼 수수료</p>
</div>
<!-- Percentage Circle Area -->
<div class="flex-col-center" style="position: relative; width: 220px; height: 220px; margin-top: 20px;">
<div style="position: absolute; width: 200px; height: 200px; background-color: rgba(97, 0, 255, 0.05); border-radius: 50%; z-index: 3;"></div>
<div class="flex-col-center" style="position: relative; width: 160px; height: 160px; background-color: white; border: 8px solid #6100FF; border-radius: 50%; z-index: 4;">
<p style="margin: 0; font-size: 48px; font-weight: 900; color: #6100FF; line-height: 1;">15%</p>
</div>
</div>
<p style="margin: 10px 0 0 0; font-size: 18px; font-weight: 500; color: #4B5563;">예약 건당 성과 수수료</p>
</div>
<!-- Bottom Banner -->
<div class="flex-row-center" style="width: 100%; height: 60px; border-top: 1px solid #e5e7eb; background-color: #fafafa; gap: 8px;">
<i class="fa-solid fa-circle-info" style="color: #6100FF; font-size: 16px;"></i>
<p style="margin: 0; font-size: 14px; font-weight: 600; color: #6100FF;">예약이 없으면 비용도 0원입니다</p>
</div>
</div>
</div>
</body>
</html>
