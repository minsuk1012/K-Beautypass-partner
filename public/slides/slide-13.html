<!DOCTYPE html>

<html data-theme="light" lang="ko">
<head>

<style>

<p style="margin: 0; font-size: 16px; font-weight: 400; color: #E5E7EB; line-height: 1.6;">앱 서비스 노출 시작 및<br/>외국인 환자 예약 수신<br/><strong style="color: #EC4899;">매출 발생 시작!</strong></p>

<div data-object="true" data-object-type="container" style="position: absolute; left: 200px; top: 560px; width: 880px; height: 140px; background-color: #FFFFFF; border-radius: 24px; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 40px;">

</div>
<!-- Content Group -->
<div style="display: flex; flex-direction: column; gap: 15px; align-items: center;">
<!-- Text -->
<p style="margin: 0; font-size: 22px; font-weight: 700; color: #1F2937; letter-spacing: -0.01em;">지금 바로 입점 신청하고 혜택을 받으세요</p>
<!-- Button -->
<div style="position: relative; width: 360px; height: 50px;">
<!-- Button Shape -->
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background-color: #6100FF; border-radius: 30px;"></div>

<!-- Text -->
<p style="position: absolute; width: 100%; text-align: center; line-height: 50px; font-size: 18px; font-weight: 700; color: #FFFFFF; margin: 0;">
